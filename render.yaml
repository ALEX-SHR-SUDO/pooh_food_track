services:
  # ZeroTier Gateway Service
  # Docker container that connects to ZeroTier network and proxies requests to the router
  - type: web
    name: pooh-zerotier-gateway
    env: docker
    dockerfilePath: ./Dockerfile.zerotier
    envVars:
      - key: ZEROTIER_NETWORK_ID
        sync: false
      - key: ROUTER_ZEROTIER_IP
        sync: false
      - key: PORT
        value: 10000

  # Backend SMS Server
  # Note: Using explicit 'cd backend &&' instead of rootDir due to Render platform issues
  # with rootDir not being respected during build phase
  - type: web
    name: pooh-food-sms-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 25.6.0
      - key: PORT
        value: 10000
      - key: ROUTER_IP
        value: pooh-zerotier-gateway.onrender.com
      - key: ROUTER_PROTOCOL
        value: http
      - key: ROUTER_USER
        sync: false
      - key: ROUTER_PASS
        sync: false
