services:
  # Backend SMS Server
  # Note: Using explicit 'cd backend &&' instead of rootDir due to Render platform issues
  # with rootDir not being respected during build phase
  - type: web
    name: pooh-food-sms-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 25.6.0
      - key: PORT
        generateValue: true
      - key: ROUTER_IP
        sync: false
      - key: ROUTER_USER
        sync: false
      - key: ROUTER_PASS
        sync: false
